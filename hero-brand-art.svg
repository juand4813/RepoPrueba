  <rect x="467" y="408" width="291" height="61" rx="31" fill="#FFFFFF"/>
  <circle cx="499" cy="438" r="4" fill="#83B844"/>
  <text x="511" y="443" fill="#173326" font-family="Arial,sans-serif" font-size="15" font-weight="700">Una comunidad, tres perfiles</text>
</svg>

